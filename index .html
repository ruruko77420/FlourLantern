<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | game one</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        /* 强制横屏核心样式 - 保证所有设备都按横屏比例显示 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* 游戏容器：全屏黑色背景，flex 居中 */
        #unity-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            /* 桌面模式保持窗口风格（可选） */
            box-shadow: none;
            border: none;
        }
        
        /* 画布：锁定 16:9 横屏比例，自动缩放，不拉伸 */
        #unity-canvas {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: #000;
        }
        
        /* 加载条样式微调，让它始终可见 */
        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            max-width: 400px;
            background: rgba(0,0,0,0.7);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            z-index: 100;
        }
        
        #unity-progress-bar-empty {
            width: 100%;
            height: 20px;
            background: #444;
            border-radius: 10px;
            overflow: hidden;
        }
        
        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: #00aaff;
            border-radius: 10px;
        }
        
        #unity-footer {
            position: fixed;
            bottom: 8px;
            right: 12px;
            display: flex;
            gap: 12px;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 20px;
            z-index: 200;
            font-size: 12px;
            color: white;
        }
        
        #unity-fullscreen-button {
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 12px;
        }
        
        /* 完全禁用 Unity 自带的移动端警告 */
        #unity-warning {
            display: none !important;
        }
        
        /* 电脑桌面端也可以保持完美比例，不会有奇怪旋转 */
        @media (min-width: 1024px) {
            #unity-canvas {
                max-width: 100%;
                max-height: 100%;
            }
        }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1920" height="1080"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button">⛶ 全屏</div>
        <div id="unity-build-title">game one</div>
      </div>
    </div>

    <script>
      (function() {
        // ---------- 强制横屏逻辑 ----------
        // 锁定游戏为 16:9 横屏比例（1920/1080 = 16/9）
        const TARGET_RATIO = 16 / 9;   // 你的游戏宽高比
        
        function resizeGameToLandscape() {
          const container = document.getElementById("unity-container");
          const canvas = document.getElementById("unity-canvas");
          if (!container) return;
          
          const windowWidth = window.innerWidth;
          const windowHeight = window.innerHeight;
          const windowRatio = windowWidth / windowHeight;
          
          let newWidth, newHeight;
          
          // 根据窗口比例，计算出让游戏保持 16:9 且完整显示在屏幕内的尺寸
          if (windowRatio > TARGET_RATIO) {
            // 窗口比目标宽 → 以高度为基准，左右留黑边
            newHeight = windowHeight;
            newWidth = windowHeight * TARGET_RATIO;
          } else {
            // 窗口比目标窄（竖屏或窄屏） → 以宽度为基准，上下留黑边
            newWidth = windowWidth;
            newHeight = windowWidth / TARGET_RATIO;
          }
          
          // 应用到容器，让画布居中靠CSS自动搞定
          container.style.width = newWidth + 'px';
          container.style.height = newHeight + 'px';
          container.style.margin = '0 auto';
          container.style.position = 'fixed';
          container.style.top = '50%';
          container.style.left = '50%';
          container.style.transform = 'translate(-50%, -50%)';
          
          // 可选：让 canvas 尺寸匹配容器
          if (canvas) {
            canvas.style.width = '100%';
            canvas.style.height = '100%';
          }
        }
        
        // 监听页面大小变化和方向变化
        window.addEventListener('resize', resizeGameToLandscape);
        window.addEventListener('orientationchange', function() {
          setTimeout(resizeGameToLandscape, 30);
        });
        
        // 启动 Unity 后再执行一次，确保稳妥
        // 原有 Unity 加载代码，稍作保留但去掉了移动端不支持的错误
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");
        
        // 完全隐藏错误横幅，避免移动端报错影响体验
        function unityShowBanner(msg, type) {
          // 什么也不做，彻底屏蔽原生警告
          console.log("[Unity] " + msg);
        }
        
        // 移动端优化：添加 viewport 确保不缩放，并且移除错误的“不支持移动设备”提示
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.getElementsByTagName('head')[0].appendChild(meta);
          container.className = "unity-mobile";
          canvas.className = "unity-mobile";
          // 不调用 unityShowBanner 错误，所以不会有红色警告
        } else {
          canvas.style.width = "1920px";
          canvas.style.height = "1080px";
        }
        
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/flour123.loader.js";
        var config = {
          dataUrl: buildUrl + "/flour123.data",
          frameworkUrl: buildUrl + "/flour123.framework.js",
          codeUrl: buildUrl + "/flour123.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "game one",
          productVersion: "1.0",
          showBanner: unityShowBanner,
        };
        
        // 先调用一次强制横屏适配
        resizeGameToLandscape();
        
        loadingBar.style.display = "block";
        
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            // 全屏按钮逻辑增强
            if (fullscreenButton) {
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            }
            // 可选：游戏启动后再次强制横屏，避免某些浏览器加载后重置
            setTimeout(resizeGameToLandscape, 100);
          }).catch((message) => {
            console.error(message);
            // 不 alert，避免影响体验，只打印错误
          });
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
